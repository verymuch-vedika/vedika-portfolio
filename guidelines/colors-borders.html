<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:24px;background:var(--white)"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px"><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border-radius:10px;background:var(--grey-100);box-shadow:inset 0 0 0 1px var(--grey-90)"></div><div style="font-size:13px;line-height:1.3">Default<br><span style="color:var(--text-secondary)">--grey-100 · #dcdcdc</span></div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border-radius:10px;background:var(--grey-90);box-shadow:inset 0 0 0 1px var(--grey-90)"></div><div style="font-size:13px;line-height:1.3">Subtle<br><span style="color:var(--text-secondary)">--grey-90 · #e3e3e3</span></div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border-radius:10px;background:var(--grey-85);box-shadow:inset 0 0 0 1px var(--grey-90)"></div><div style="font-size:13px;line-height:1.3">Divider<br><span style="color:var(--text-secondary)">--grey-85 · #e4e4e4</span></div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:64px;border-radius:10px;background:var(--grey-80);box-shadow:inset 0 0 0 1px var(--grey-90)"></div><div style="font-size:13px;line-height:1.3">Card outline<br><span style="color:var(--text-secondary)">--grey-80 · #e6e6e6</span></div></div></div></body></html>
