<!-- @dsCard group="Components" viewport="820x460" name="Mobile" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Mobile</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../components/_loader.js"></script></head><body style="background:#e9e9e9;padding:24px"><div id="r"></div>
<script type="text/babel">
loadVDS('../../').then(({ MobileNav, TimelineStepper, PillTabs }) => {
  function Stepper() { const [i, setI] = React.useState(3); const ys = ['2015', '2019', '2019', '2022', '2023', '2024']; return <TimelineStepper label={ys[i]} index={i} count={6} onPrev={() => setI(Math.max(0, i - 1))} onNext={() => setI(Math.min(5, i + 1))} />; }
  const Phone = ({ children, bg = 'var(--surface-canvas)' }) => <div style={{ width: 375, height: 410, background: bg, borderRadius: 24, overflow: 'hidden', position: 'relative' }}>{children}</div>;
  ReactDOM.createRoot(document.getElementById('r')).render(<div style={{ display: 'flex', gap: 24 }}>
    <Phone><MobileNav defaultOpen links={[{ label: 'Work' }, { label: 'Highlights' }, { label: 'LinkedIn' }, { label: 'Resume (PDF)' }]} /></Phone>
    <Phone bg="var(--grey-20)"><div style={{ padding: 20, display: 'grid', gap: 28 }}>
      <div style={{ margin: '0 -20px', padding: '10px 20px', background: 'rgba(243,243,243,.92)' }}><PillTabs items={[{ num: '01', label: 'DPCL' }, { num: '02', label: 'ZMW' }, { num: '03', label: 'Pearstream' }, { num: '04', label: 'Mature Money' }]} active={1} /></div>
      <Stepper />
    </div></Phone>
  </div>);
});
</script></body></html>
